name: Publish
on:
  push:
    branches:
      - 'main'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  runtime-tests:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - node
          - bun
          - deno
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x

      - run: bun install --frozen-lockfile
      - run: bun run test:${{ matrix.runtime }}

  publish:
    needs: runtime-tests
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run smoke:node
      - run: bun run package:check
      - run: bun run pack:dry-run
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
